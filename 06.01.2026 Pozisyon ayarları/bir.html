<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .bir {
            background-color: lightblue;
            height: 50px;
            width: 50px;
            border: 2px solid black;
            display: inline-block;
        }

        .iki {
            background-color: lightblue;
            height: 50px;
            width: 50px;
            border: 2px solid black;
            display: inline-block;
        }

        .uc {
            background-color: lightblue;
            height: 50px;
            width: 50px;
            display: inline-block;
            border: 2px solid black;
            border-style: dotted;
            position: relative;
            left: 30px;
            top: 30px;
        }

        .dort {
            background-color: lightblue;
            height: 50px;
            width: 50px;
            display: inline-block;
            border: 2px solid black;
        }
    </style>
</head>

<body>
    <div class="bir">a</div>
    <div class="iki">b</div>
    <div class="uc">c</div>
    <div class="dort">d</div>
</body>

</html>
