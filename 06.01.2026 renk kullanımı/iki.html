<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .bir {
            width: 20%;
            background: linear-gradient(to right, skyblue, #23538A);
        }

        .iki {
            width: 30%;
            background: linear-gradient(to left, red, black);
        }

        .uc {
            width: 40%;
            background: linear-gradient(to right top, #0cbaba, #380036, darksalmon);
        }

        div {
            height: 100px;
            color: white;
            font-size: 20px;
            border-radius: 10px;
        }

        div:hover {
            width: 1000px;
            cursor: hand;
            transition-property: width;
            transition-duration: 0.5s;
            transition-delay: 0.1s;
        }
    </style>
</head>

<body>
    <div class="bir">bir</div>
    <div class="iki">iki</div>
    <div class="uc">uc</div>
</body>

</html>
