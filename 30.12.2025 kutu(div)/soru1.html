<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .üst {
            height: 50px;
            background-color: tomato;
            text-align: center;
        }

        .sol {
            text-align: center;
            width: 30%;
            height: 500px;
            background-color: blue;
            display: inline-block;
            float: left;
        }

        .orta {
            text-align: center;
            width: 40%;
            height: 500px;
            background-color: aliceblue;
            display: inline-block;
        }

        .sağ {
            text-align: center;
            width: 30%;
            height: 500px;
            background-color: blue;
            display: inline-block;
            float: right;
        }

        .alt {
            text-align: center;
            height: 50px;
            background-color: rgb(197, 82, 28);

        }
    </style>
</head>

<body>
    <div class="üst">üst bölüm</div>
    <div class="sol">sol</div>
    <div class="orta">orta</div>
    <div class="sağ">sağ</div>
    <div class="alt">alt</div>
</body>

</html>
